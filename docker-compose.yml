services:
  postgres:
    image: postgres:16-alpine
    container_name: elo-postgres
    environment:
      POSTGRES_DB: elo
      POSTGRES_USER: elo
      POSTGRES_PASSWORD: elo_dev
    ports:
      - "5432:5432"
    volumes:
      - elo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elo -d elo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=elo;Username=elo;Password=elo_dev
      Cors__Origins__0: http://localhost:3000
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elo-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  elo_pgdata:
