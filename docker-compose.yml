services:
  postgres:
    image: postgres:16-alpine
    container_name: elo-postgres
    environment:
      POSTGRES_DB: elo
      POSTGRES_USER: elo
      POSTGRES_PASSWORD: elo_dev
    # Só na máquina (não expor Postgres na internet)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - elo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elo -d elo"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=elo;Username=elo;Password=elo_dev
      Cors__Origins__0: http://localhost:3000
      Cors__Origins__1: http://66.94.98.57:3000
    # 5080 no host — 5000/5001 costumam estar ocupadas no Contabo
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080/api/v1
    container_name: elo-frontend
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  elo_pgdata:
